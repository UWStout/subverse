services:
  # Base SVN gateway with WEBDAV and svnserve services running
  svn_gateway:
    container_name: svn_gateway
    build:
      context: .
      dockerfile: Dockerfile.svn-gateway
    restart: unless-stopped

    volumes:
      - svn-root:/var/svn
      - ./config/apache2-gateway:/etc/apache2
      - ./config/subversion:/etc/subversion

    environment:
      TZ: 'America/Chicago'

    networks:
      - traefik

    labels:
      # Enable as a 'traefik' service and configure
      traefik.enable: true
      traefik.docker.network: "traefik"

      # Subversion WebDAV service & router configuration for traefik
      traefik.http.services.svn_gateway.loadbalancer.server.port: "8080"
      traefik.http.routers.svn_gateway.service: "svn_gateway"
      traefik.http.routers.svn_gateway.rule: "Host(`svn.subverse`)"
      traefik.http.routers.svn_gateway.entrypoints: "websecure"
      traefik.http.routers.svn_gateway.tls: "true"

      # Subversion svnserve service & router configuration for traefik
      # traefik.http.services.svn_serve.loadbalancer.server.port: 3690
      # traefik.http.routers.svn_serve.service: svn_serve
      # traefik.http.routers.svn_serve.rule: PathPrefix(`/svn`)
      # traefik.http.routers.svn_serve.entrypoints: websecure
      # traefik.http.routers.svn_serve.tls: true

  # Administrator service with PHP + 'svnadmin' (and no WEBDAV or svnserve)
  svn_admin:
    container_name: svn_admin
    build:
      context: .
      dockerfile: Dockerfile.svn-admin
    restart: unless-stopped

    volumes:
      - svn-root:/var/svn
      - ./config/apache2-admin:/etc/apache2
      - ./config/subversion:/etc/subversion
      - ./config/php:/etc/php84
      - ./config/svnadmin:/opt/svnadmin/data

    environment:
      TZ: 'America/Chicago'

    networks:
      - traefik

    labels:
      # Enable as a 'traefik' service and configure
      traefik.enable: true
      traefik.docker.network: "traefik"

      # IF.SVNAdmin service & router configuration for traefik
      traefik.http.services.svnadmin.loadbalancer.server.port: 8080
      traefik.http.routers.svnadmin.service: svnadmin
      traefik.http.routers.svnadmin.rule: Host(`svnadmin.subverse`)
      traefik.http.routers.svnadmin.entrypoints: websecure
      traefik.http.routers.svnadmin.tls: true
