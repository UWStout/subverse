# dav_svn.conf file
LoadModule dav_svn_module /usr/lib/apache2/mod_dav_svn.so
LoadModule authz_svn_module /usr/lib/apache2/mod_authz_svn.so

<Location /svn>
  DAV svn
  SVNParentPath /var/svn
  SVNListParentPath On
  AuthType Basic
  AuthName "Subversion Repository"
  AuthUserFile /etc/subversion/passwd
  AuthzSVNAccessFile /etc/subversion/subversion-access-control
  Require valid-user

  # Large commits (branch creation, moves) stream many big files. The global
  # RequestReadTimeout enforces a 500 B/s minimum body rate and aborts with
  # 408 if the client stalls for 20s; on the NAS disk that can happen while
  # mod_dav_svn is writing, and the aborted request surfaces as a 502 at
  # Traefik. Disable the body-rate check here (header timeout still applies).
  <IfModule reqtimeout_module>
    RequestReadTimeout header=60 body=0
  </IfModule>

  # TLS is terminated by Traefik, so Apache sees plain HTTP and would emit
  # http:// Location headers on its redirects. Rewrite them to the external
  # https scheme so clients are never bounced off HTTPS.
  <IfModule headers_module>
    Header always edit Location "^http://" "https://"
  </IfModule>
</Location>
