entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs:
        - "172.19.0.1/24"

api:
  dashboard: true
  debug: false
  insecure: false

log:
  filePath: './logs/traefik.log'
  level: 'INFO'

accessLog:
  filePath: './logs/access.log'
  filters:
    statusCodes:
      - "200"
      - "300-308"
      - "400-599"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false # Secure: only expose labeled containers
  file:
    filename: './dynamic.yaml'
