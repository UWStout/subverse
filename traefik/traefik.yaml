entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs:
        - "172.19.0.1/24"

# Upstream (backend) connection handling.
# idleConnTimeout MUST stay lower than the Apache KeepAliveTimeout in
# subversion/config/apache2-gateway/conf.d/default.conf (65s). That way
# Traefik always closes idle backend connections first. If Apache closed
# them first, Traefik could reuse a dead connection for the next request
# and return 502 on non-retryable requests (PUT/MKCOL during commits).
transport:
  responding:
    idleConnTimeout: "10s"

api:
  dashboard: true
  debug: false
  insecure: false

log:
  filePath: './logs/traefik.log'
  level: 'INFO'

accessLog:
  filePath: './logs/access.log'
  filters:
    statusCodes:
      - "400-499"
      - "500-599"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false # Secure: only expose labeled containers
  file:
    filename: './dynamic.yaml'
